ed/retired invocation.</text><text x="287.414" y="908.152" fill="#000" font-size="22" textLength="586.094">G_RETIRE: compare the exact work/association retired.</text><text x="287.414" y="934.063" fill="#000" font-size="22" textLength="579.111">Recheck current context + permission at start/accept.</text><text x="287.414" y="959.973" fill="#000" font-size="22" textLength="559.754">Stale events cannot retire or alter replacement work.</text><text x="287.414" y="985.883" fill="#000" font-size="22"> </text><text x="287.414" y="1011.793" fill="#000" font-size="22" textLength="622.735">ACCEPTED stores one immutable RiskReview; its outcome:</text><text x="287.414" y="1037.703" fill="#000" font-size="22" textLength="411.748">PASS | PASS_WITH_WARNING | REVISE |</text><text x="287.414" y="1063.613" fill="#000" font-size="22" textLength="368.554">NEEDS_INFORMATION | ESCALATE.</text><text x="287.414" y="1089.523" fill="#000" font-size="22" textLength="503.637">Those five results are NOT these seven phases.</text><text x="287.414" y="1115.434" fill="#000" font-size="22" textLength="595.923">New proposal → new work; same-proposal retry → new</text><text x="287.414" y="1141.344" fill="#000" font-size="22" textLength="543.039">selected invocation. Failure is not a sixth outcome.</text><text x="287.414" y="1167.254" fill="#000" font-size="22"> </text><text x="287.414" y="1193.164" fill="#000" font-size="22" textLength="637.635">Compact projection of member-c-state.puml (MC-SM-0.1).</text><text x="287.414" y="1219.074" fill="#000" font-size="22" textLength="650.708">Complete actions/bounds: docs/18 MC-D01-03 disposition.</text><text x="287.414" y="1244.984" fill="#000" font-size="22" textLength="580.336">No new wire fields; design only, not runtime evidence.</text></g><?plantuml-src VLNDRjj64BxlKqpJIzjKaktyDB030un4HKHjoY9fnKKI62joP6r5xhAxIyaASkYf3r3qNNhle-H9EakAak2wEL6QRtw_-TblIitl2WuvtwZAWYdGSicP5JP7w8Ent29y-VqlqBWIkEwibLw2Mg5s_px8otudlkn4Lqddg7iC__mD1bSeGKYBMl8SoWKtQDX2P0XOb7O36PfK