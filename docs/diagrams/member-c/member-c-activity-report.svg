<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:865px;height:1341px;background:#FFFFFF;" width="865px" height="1341px" viewBox="0 0 865 1341" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="256.422" y="43.203" fill="#000" font-size="24" textLength="351.105" font-weight="700">C activity — report overview</text><text x="208.316" y="71.469" fill="#000" font-size="24" textLength="447.316" font-weight="700">MC-ACT-RPT-0.1 · AH-08 / UC-02</text></g><ellipse cx="247.689" cy="102.531" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="25.517" y="132.531" width="444.346" height="43.555" fill="#EEF4F8" style="stroke:#27465B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="35.517" y="161.867" fill="#000" font-size="20" textLength="424.346">A / Domain admits current authorised work</text><rect x="35.644" y="196.086" width="424.092" height="67.109" fill="#EEF4F8" style="stroke:#27465B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="45.644" y="225.422" fill="#000" font-size="20" textLength="394.131">C1 retrieves original sources + conflicts;</text><text x="45.644" y="248.977" fill="#000" font-size="20" textLength="404.092">A / Assessment drafts a candidate packet</text><path d="M454.633,273.195 L454.633,533.297 L434.633,537.297 L454.633,541.297 L454.633,801.398 A0,0 0 0 0 454.633,801.398 L844.949,801.398 A0,0 0 0 0 844.949,801.398 L844.949,283.195 L834.949,273.195 L454.633,273.195 A0,0 0 0 0 454.633,273.195" style="stroke:#181818;stroke-width:0.5;" fill="#FFF5D9"/><path d="M834.949,273.195 L834.949,283.195 L844.949,283.195 L834.949,273.195" style="stroke:#181818;stroke-width:0.5;" fill="#FFF5D9"/><text x="460.633" y="297.531" fill="#000" font-size="20" textLength="302.324" font-weight="700">Five results, not work phases</text><text x="460.633" y="321.086" fill="#000" font-size="20" textLength="320.225">PASS → guarded Founder review.</text><text x="460.633" y="344.641" fill="#000" font-size="20" textLength="299.971">PASS_WITH_WARNING → same;</text><text x="460.633" y="368.195" fill="#000" font-size="20" textLength="150.869">show warnings.</text><text x="460.633" y="391.75" fill="#000" font-size="20" textLength="319.18">REVISE → bounded new proposal</text><text x="460.633" y="415.305" fill="#000" font-size="20" textLength="294.346">and fresh independent review.</text><text x="460.633" y="438.859" fill="#000" font-size="20" textLength="363.799">NEEDS_INFORMATION → clarification;</text><text x="460.633" y="462.414" fill="#000" font-size="20" textLength="368.643">accepted answer → new input/review.</text><text x="460.633" y="485.969" fill="#000" font-size="20" textLength="268.73">ESCALATE → BLOCK visible;</text><text x="460.633" y="509.523" fill="#000" font-size="20" textLength="211.572">revision/manual only.</text><text x="460.633" y="533.078" fill="#000" font-size="20"> </text><text x="460.633" y="556.633" fill="#000" font-size="20" textLength="280.498" font-weight="700">Guards and exception exits</text><text x="460.633" y="580.188" fill="#000" font-size="20" textLength="341.455">Only Domain writes business state.</text><text x="460.633" y="603.742" fill="#000" font-size="20" textLength="369.053">Stale events cannot change new work.</text><text x="460.633" y="627.297" fill="#000" font-size="20" textLength="369.316">Incomplete/removed/oversized input:</text><text x="460.633" y="650.852" fill="#000" font-size="20" textLength="167.598">no partial review.</text><text x="460.633" y="674.406" fill="#000" font-size="20" textLength="325.781">Technical failure ≠ Risk outcome.</text><text x="460.633" y="697.961" fill="#000" font-size="20" textLength="333.867">Exhausted REVISE: keep real result</text><text x="460.633" y="721.516" fill="#000" font-size="20" textLength="330.791">and proposal; stop machine work;</text><text x="460.633" y="745.07" fill="#000" font-size="20" textLength="292.803">no fabricated ESCALATE reply.</text><text x="460.633" y="768.625" fill="#000" font-size="20" textLength="339.668">No proposal: genuine failure/order</text><text x="460.633" y="792.18" fill="#000" font-size="20" textLength="210.195">block → manual only.</text><rect x="60.746" y="503.742" width="373.887" height="67.109" fill="#EEF4F8" style="stroke:#27465B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="70.746" y="533.078" fill="#000" font-size="20" textLength="353.887">C1 verifies exact citation references;</text><text x="70.746" y="556.633" fill="#000" font-size="20" textLength="317.568">resolvability is not claim support</text><rect x="26.845" y="821.398" width="441.689" height="90.664" fill="#EEF4F8" style="stroke:#27465B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36.845" y="850.734" fill="#000" font-size="20" textLength="391.309">A / Domain validates complete material,</text><text x="36.845" y="874.289" fill="#000" font-size="20" textLength="409.531">capacity and case/input/proposal/corpus;</text><text x="36.845" y="897.844" fill="#000" font-size="20" textLength="421.689">atomically accepts packet + bundle + audit</text><rect x="34.604" y="932.063" width="426.172" height="67.109" fill="#EEF4F8" style="stroke:#27465B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="44.604" y="961.398" fill="#000" font-size="20" textLength="406.172">A / Domain selects; Orchestrator invokes;</text><text x="44.604" y="984.953" fill="#000" font-size="20" textLength="399.072">C2 independently reviews accepted input</text><rect x="16" y="1019.172" width="463.379" height="67.109" fill="#EEF4F8" style="stroke:#27465B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="1048.508" fill="#000" font-size="20" textLength="443.379">A / Domain checks reply and current identity;</text><text x="26" y="1072.063" fill="#000" font-size="20" textLength="407.227">atomically stores valid RiskReview + audit</text><rect x="33.944" y="1106.281" width="427.49" height="67.109" fill="#EEF4F8" style="stroke:#27465B;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="43.944" y="1135.617" fill="#000" font-size="20" textLength="407.49">A / Domain routes the accepted outcome;</text><text x="43.944" y="1159.172" fill="#000" font-size="20" textLength="342.197">no review outcome grants approval</text><ellipse cx="247.689" cy="1204.391" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="247.689" cy="1204.391" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="247.689" y1="112.531" x2="247.689" y2="132.531" style="stroke:#27465B;stroke-width:1;"/><polygon points="243.689,122.531,247.689,132.531,251.689,122.531,247.689,126.531" fill="#27465B" style="stroke:#27465B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="247.689" y1="176.086" x2="247.689" y2="196.086" style="stroke:#27465B;stroke-width:1;"/><polygon points="243.689,186.086,247.689,196.086,251.689,186.086,247.689,190.086" fill="#27465B" style="stroke:#27465B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="247.689" y1="263.195" x2="247.689" y2="503.742" style="stroke:#27465B;stroke-width:1;"/><polygon points="243.689,493.742,247.689,503.742,251.689,493.742,247.689,497.742" fill="#27465B" style="stroke:#27465B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="247.689" y1="570.852" x2="247.689" y2="821.398" style="stroke:#27465B;stroke-width:1;"/><polygon points="243.689,811.398,247.689,821.398,251.689,811.398,247.689,815.398" fill="#27465B" style="stroke:#27465B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="247.689" y1="912.063" x2="247.689" y2="932.063" style="stroke:#27465B;stroke-width:1;"/><polygon points="243.689,922.063,247.689,932.063,251.689,922.063,247.689,926.063" fill="#27465B" style="stroke:#27465B;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="