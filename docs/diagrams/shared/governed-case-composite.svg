xt x="499.93" y="424.105" fill="#000" font-size="14" textLength="24.91">A03</text></g><!--link DOM_GUARD to EX_GUARD--><g class="link" data-entity-1="ent0011" data-entity-2="ent0020" id="lnk33" data-source-line="53" data-link-type="association"><path d="M678.66,366.05 C703.42,383.43 801.15,452.02 827.41,470.45" style="stroke:#27465B;stroke-width:1;" fill="none" id="DOM_GUARD-EX_GUARD"/><text x="763.93" y="424.105" fill="#000" font-size="14" textLength="24.91">A04</text></g><!--link EX_DOMAIN to DOM_RESULTS--><g class="link" data-entity-1="ent0021" data-entity-2="ent0008" id="lnk34" data-source-line="54" data-link-type="association"><path d="M852.18,634.1 C857.78,630.01 866.4,624.47 874.93,622.03 C901.75,614.35 1354.59,624.74 1376.93,608.03 C1408,584.8 1403.93,563.82 1403.93,525.03 C1403.93,302.03 1403.93,302.03 1403.93,302.03 C1403.93,236.17 1178.83,251.56 1115.93,232.03 C1101.4,227.52 1084.84,220.82 1076.09,217.16" style="stroke:#27465B;stroke-width:1;" fill="none" id="EX_DOMAIN-DOM_RESULTS"/><text x="1404.93" y="424.105" fill="#000" font-size="14" textLength="24.91">A05</text></g><!--link DOM_STORE to REPO_CASE--><g class="link" data-entity-1="ent0012" data-entity-2="ent0024" id="lnk35" data-source-line="55" data-link-type="association"><path d="M928.39,367.18 C941.05,386 984.75,450.98 997.45,469.85" style="stroke:#27465B;stroke-width:1;" fill="none" id="DOM_STORE-REPO_CASE"/><text x="967.93" y="424.105" fill="#000" font-size="14" textLength="24.91">A06</text></g><!--link DOM_AUDIT to AUD_APPEND--><g class="link" data-entity-1="ent0013" data-entity-2="ent0026" id="lnk36" data-source-line="56" data-link-type="association"><path d="M1162.21,367.18 C1174.21,386 1215.6,450.98 1227.63,469.85" style="stroke:#27465B;stroke-width:1;" fill="none" id="DOM_AUDIT-AUD_APPEND"/><text x="1199.93" y="424.105" fill="#000" font-size="14" textLength="24.91">A07</text></g><g class="legend" data-source-line="58"><rect x="462.315" y="797.605" width="612.301" height="250.119" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="467.315" y="816.681" fill="#000" font-size="14" textLength="450.543">case: authenticated API only; D01 also serves the two rc.4 history GETs.</text><text x="467.315" y="833.832" fill="#000" font-size="14" textLength="462.287">rc.4 OpenAPI: original 13 public operations retained, 15 operations in total.</text><text x="467.315" y="850.983" fill="#000" font-size="14" textLength="540.087">images / labelStore: scoped internal A-managed artifact boundaries, not public AI tools.</text><text x="467.315" y="868.135" fill="#000" font-size="14" textLength="511.998">CaseRepository is the only business-state store interface; Domain is its only caller.</text><text x="467.315" y="885.286" fill="#000" font-size="14" textLength="549.042">Repository + business AuditPort share one transaction context and one authoritative DB.</text><text x="467.315" y="902.438" fill="#000" font-size="14" textLength="552.528">Analysis/execution observations are untrusted until Domain validates and creates events.</text><text x="467.315" y="919.589" fill="#000" font-size="14" textLength="528.411">New effects additionally require CS-03 guards; a connector alone proves no ordering.</text><text x="467.315" y="936.74" fill="#000" font-size="14"> </text><text x="467.315" y="953.892" fill="#000" font-size="14" textLength="443.181">role : Type [multiplicity] = part property, not a deployed object snapshot.</text><text x="467.315" y="971.043" fill="#000" font-size="14" textLength="519.06">P = provided contract; R = required contract. Interface meanings: docs/13 section 3.</text><text x="467.315" y="988.194" fill="#000" font-size="14" textLength="428.388">Solid lines = connectors carrying request/reply, not sequence arrows.</text><text x="467.315" y="1005.346" fill="#000" font-size="14" textLength="473.936">Dxx = delegation to a boundary port; Axx = assembly between internal parts.</text><text x="467.315" y="1022.497" fill="#000" font-size="14" textLength="602.301">The two part types refined in CS-02/03 organise existing responsibilities; no new service/process.</text><text x="467.315" y="1039.648" fill="#000" font-size="14" textLength="550.929">A integrates; C reviews; B/C contribution confirmations and F.01/M-S.01 remain pending.</text></g><?plantuml-src VLRRSjis47tdL-oaB-aqjYnVaiQUFj0IvT7KiLNHdYJJP38G2SceAO85GCjg9l_Ui-15egpsIHJsO6zdTx5EkKpI83uuwbEFhlIJDBbCQI2ifD1QQUrIvkvBFj3BGblb95bdoiILHb8YybIbmbNt3_k1VLHv8OnOKiBm73TZjuP-8nCdyaKcjo2fd8ioSoETknknb1IBtCRIgFb-JAp-aTG_tHBQ1v7gbSeND1UPbVkiNuhaSM5qcQS3dMb3FqNHw7JqwrweDgaqDUputUdRiyijM6YCNlsNCDTElh0q6etEXkyxg5HQMT3xewr38_97Fdnx50IjA_IguO5fs6RXUs4qQ011BGif9PcmLisLD3zUaR0KhwsJI_eU41NQE9NJguJfV3tvkP9_ZhyDmZYgvRg4GRKK2sdfzNG36Ny8hw9u6vI9cSnYfq7zDl0wl8okum38hGXIlHImV4v3_m5YdrGYwS_-Lt-lElK-RhmKHP6fH3YbyzRPuUs7R-5aqiNb8bjRPGSe2wEpBlOclFuSZ-FE1Lr8uzNkkp6Dullhkyq57sfZugCsZssmZFvuE_sz2vNFCYbP-Gjiz2aQTB6fJ9HbFnvaqiLUtOVJOHVCf7MppS3uxdOQxJXRfifrGE7zS7m7q8ykAKrKeAMfiB0v0ZEeB_bSeAbHL4WRD_LnLL8jgalOoaTSvpAysPESkWmQtu21U-7ufelQgJwWskBRYQ1DzbO8KNksFuQJAeODx7-2Y3vrWs303caRv1xETk85Q5-yUne9oBgFNiIygOFpB_b4MxSmClxZccV3LFgXhCswxIm-seamwIAR2ARHvBOP1Bk5uYiAviQvamkZt3haap0LXPEcjUKFNpQnpDDDLTmFkN-Zcw6tyYC8cl531mTDT_EOEEe7BUyisemWBpqEsWmrqleVIq-2fZTPM5SY966bjUAWDLYF22y_3ffEPN5DlvTKEZt7jQZwPjbfq3BRQAt7Y1UV1MsdihXDj1U-3TeEzSws2VBITq6GoGLdSAQTqqlc1VITaoZT0xZX-OZI3YTZqdcslk344Pu_JHOZ5aq45BcL9fCSdjA3ifxog-ZE7aALFxm5GRX_JjgeXK9dK_-4YdA6sKljfBHuinrAMQPlg7-sVGwIdNOYOtrru_PeKz7dP1EWkVjGAgmzF5XYy2nm950YSv4un8Q7KXWbxHj-FHlhuHYgTUPTtIblLKN6CTEij73CsWFhX5z8k3UyEIYN5ytZWYlAsUfA8h9C6jQxfVENLbDLoHEKC6yLXkqWYtYSBRpbaP7WuP3FZZ1Ol8pPGFfWNpr96bwovcP8zZP3Ii-ObJfnhBV4-rDQPX1VAcjSVHAPNwIiDv0OwR_b4mZtoRYHAvBpEROe85Au2eM8Q0sI_YwLgHQm4rgKmgJsWWJxcmEDHKHax2_s1YwEN9DVSx0q7VA3ZRSGKuNkrWMUvYKsBSKlCDhzA_r6s50SNmJrRbtn9B2H5PbUmtyz-mi6oEQYi0_QiPSJlWH3YeSlPymWUnSqnN7jv-RuaCODORIK8eT7zfnIdTWUgj7AAkqdh3RMI0vbJ1GqjP5Pa6hCclS_rYwjwnauLtjg-IY7Si6Rcq_YyFaPzrE9_gfs3ASHK5sAQp_0BYZq82nKSZdZKfDk9MM-AMPEYjTsL_UPpv930hbZvjmmxTlP0oNQ