ink-type="association"><path d="M728.183,104.17 C728.183,126.6 728.183,215.7 728.183,238.3" style="stroke:#27465B;stroke-width:1;" fill="none" id="EX_WORK-OP_WORK"/><text x="729.183" y="161.105" fill="#000" font-size="14" textLength="25.683">D21</text></g><!--link EX_DECISION to GU_DECISION--><g class="link" data-entity-1="ent0003" data-entity-2="ent0014" id="lnk21" data-source-line="40" data-link-type="association"><path d="M490.793,99.6 C512.243,101.8 591.143,109.84 656.183,116.03 C752.703,125.21 1525.183,98.08 1525.183,195.03 C1525.183,195.03 1525.183,195.03 1525.183,428.03 C1525.183,495.01 1425.653,531.29 1400.773,539.31" style="stroke:#27465B;stroke-width:1;" fill="none" id="EX_DECISION-GU_DECISION"/><text x="1526.183" y="308.105" fill="#000" font-size="14" textLength="25.683">D22</text></g><!--link OP_DOMAIN to EX_DOMAIN--><g class="link" data-entity-1="ent0008" data-entity-2="ent0004" id="lnk22" data-source-line="41" data-link-type="association"><path d="M773.123,430.35 C760.583,435.1 730.823,446.04 705.183,453.03 C538.793,498.4 329.873,533.68 291.413,540.01" style="stroke:#27465B;stroke-width:1;" fill="none" id="OP_DOMAIN-EX_DOMAIN"/><text x="614.183" y="490.105" fill="#000" font-size="14" textLength="25.683">D23</text></g><!--link OP_LABELS to EX_LABELS--><g class="link" data-entity-1="ent0012" data-entity-2="ent0005" id="lnk23" data-source-line="42" data-link-type="association"><path d="M627.003,433.15 C619.653,438.95 606.803,448.21 594.183,453.03 C580.783,458.15 115.443,530.71 55.513,540.04" style="stroke:#27465B;stroke-width:1;" fill="none" id="OP_LABELS-EX_LABELS"/><text x="456.183" y="490.105" fill="#000" font-size="14" textLength="25.683">D24</text></g><!--link OP_CHECK to GU_DISPATCH--><g class="link" data-entity-1="ent0009" data-entity-2="ent0015" id="lnk24" data-source-line="43" data-link-type="association"><path d="M1375.173,429.67 C1356.653,434.87 1298.983,451.97 1255.183,475.03 C1219.193,493.98 1180.873,524.64 1166.783,536.31" style="stroke:#27465B;stroke-width:1;" fill="none" id="OP_CHECK-GU_DISPATCH"/><text x="1256.183" y="490.105" fill="#000" font-size="14" textLength="24.91">A21</text></g><!--link OP_RET to RE_EFFECT--><g class="link" data-entity-1="ent0010" data-entity-2="ent0017" id="lnk25" data-source-line="44" data-link-type="association"><path d="M945.373,431.29 C910.613,447.94 753.313,523.25 721.723,538.38" style="stroke:#27465B;stroke-width:1;" fill="none" id="OP_RET-RE_EFFECT"/><text x="849.183" y="490.105" fill="#000" font-size="14" textLength="24.91">A22</text></g><!--link OP_NOTIFY to NO_DELIVER--><g class="link" data-entity-1="ent0011" data-entity-2="ent0019" id="lnk26" data-source-line="45" data-link-type="association"><path d="M1202.493,431.79 C1171.573,449.18 1042.703,521.62 1013.913,537.81" style="stroke:#27465B;stroke-width:1;" fill="none" id="OP_NOTIFY-NO_DELIVER"/><text x="1121.183" y="490.105" fill="#000" font-size="14" textLength="24.91">A23</text></g><g class="legend" data-source-line="47"><rect x="461.069" y="727.03" width="645.045" height="301.573" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="466.069" y="746.105" fill="#000" font-size="14" textLength="556.336">A22 new effect requires: current eligible case and PASS/PASS_WITH_WARNING review;</text><text x="466.069" y="763.257" fill="#000" font-size="14" textLength="549.726">exact trusted ApprovalRecord; G-DISPATCH + provider permission; durable claim/intent.</text><text x="466.069" y="780.408" fill="#000" font-size="14" textLength="568.859">D22 validates the decision before Domain creates approval; A21 rechecks every new effect.</text><text x="466.069" y="797.56" fill="#000" font-size="14" textLength="555.604">Operations supplies Domain-loaded records to Guard; Guard has no repository-write port.</text><text x="466.069" y="814.711" fill="#000" font-size="14" textLength="576.666">A22 also supports authorised historical lookup; lookup never grants fresh execution authority.</text><text x="466.069" y="831.862" fill="#000" font-size="14" textLength="522.108">UNKNOWN is reconciled with original identity before any guarded retry; see MA-0.1.</text><text x="466.069" y="849.014" fill="#000" font-size="14" textLength="634.225">A23 needs a saved outcome, not an execution approval: REJECT/manual may notify with zero effects.</text><text x="466.069" y="866.165" fill="#000" font-size="14" textLength="576.625">Notification failure cannot replay A22; D23 submits outcomes for Domain to persist and audit.</text><text x="466.069" y="883.316" fill="#000" font-size="14" textLength="571.184">Guard/provider observations return through their callers and D23 / D22 to Domain AuditPort.</text><text x="466.069" y="900.468" fill="#000" font-size="14"> </text><text x="466.069" y="917.619" fill="#000" font-size="14" textLength="581.677">P/R = provided/required contract; Dxx delegation; Axx assembly; lines are not message order.</text><text x="466.069" y="934.771" fill="#000" font-size="14" textLength="635.045">A22 is a required/provided binding, not permission to bypass A21; preconditions above are mandatory.</text><text x="466.069" y="951.922" fill="#000" font-size="14" textLength="559.494">CS-D03: this view is the mock configuration; A3 is a later alternative behind the same port.</text><text x="466.069" y="969.073" fill="#000" font-size="14" textLength="545.952">Select exactly one configured adapter per logical operation; no mock + A3 double effect.</text><text x="466.069" y="986.225" fill="#000" font-size="14" textLength="533.839">A3 needs separately verified no-charge test authority; no such access is claimed here.</text><text x="466.069" y="1003.376" fill="#000" font-size="14" textLength="603.053">D24 is A-managed label artifact persistence (CS-Q02), not a customer upload or case-state write.</text><text x="466.069" y="1020.527" fill="#000" font-size="14" textLength="597.639">MA-D/Q decisions, F.01 acceptance and human review remain pending; no runtime safety proof.</text></g><?plant