558.105" fill="#000" font-size="14" textLength="174.234" font-weight="700">guard : ApprovalGuard [1]</text><text x="1184.324" y="575.257" fill="#000" font-size="14" textLength="186.717" font-weight="700">{A2; verdict is not approval}</text></g><!--cluster ReturnAdapter--><g class="cluster" data-qualified-name="Execution.ReturnAdapter" id="ent0016" data-source-line="31"><rect x="525.183" y="542.03" width="241" height="149" fill="#EEF4F8" style="stroke:#27465B;stroke-width:1;" rx="2.5" ry="2.5"/><text x="586.562" y="558.105" fill="#000" font-size="14" textLength="118.241" font-weight="700">returnsLogistics :</text><text x="533.666" y="575.257" fill="#000" font-size="14" textLength="224.034" font-weight="700">MockReturnsLogisticsAdapter [1]</text><text x="530.162" y="592.408" fill="#000" font-size="14" textLength="231.041" font-weight="700">{configured provider role; CS-D03}</text></g><!--cluster NotifyAdapter--><g class="cluster" data-qualified-name="Execution.NotifyAdapter" id="ent0018" data-source-line="34"><rect x="863.183" y="542.03" width="214" height="149" fill="#EEF4F8" style="stroke:#27465B;stroke-width:1;" rx="2.5" ry="2.5"/><text x="928.189" y="558.105" fill="#000" font-size="14" textLength="83.986" font-weight="700">notification :</text><text x="876.845" y="575.257" fill="#000" font-size="14" textLength="186.676" font-weight="700">MockNotificationAdapter [1]</text><text x="867.849" y="592.408" fill="#000" font-size="14" textLength="204.668" font-weight="700">{saved-message delivery only}</text></g><g class="entity" data-qualified-name="Execution.EX_WORK" id="ent0002" data-source-line="14"><text x="702.127" y="76.954" fill="#000" font-size="14" textLength="52.11">work (P)</text><rect x="722.183" y="92.03" width="12" height="12" fill="#F1F1F1" style="stroke:#181818;stroke-width:1.5;"/></g><g class="entity" data-qualified-name="Execution.EX_DECISION" id="ent0003" data-source-line="15"><text x="427.883" y="76.954" fill="#000" font-size="14" textLength="113.6">d