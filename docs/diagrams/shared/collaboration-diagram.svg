10;stroke-width:0.5;"/><path d="M1662.5386,654.2402 L1662.5386,662.2402 A2,2 0 0 0 1664.5386,664.2402 L1672.5386,664.2402 L1662.5386,654.2402" fill="#FFF8E7" style="stroke:#B27B10;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="284.8291" x="1119.5" y="671.8462">MBSE Architectural Invariant (Strict Authority Barrier):</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="9.1738" x="1119.5" y="686.8691">1.</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="169.2808" x="1131.73" y="686.8691">Zero Agent Execution Authority:</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="285.5542" x="1304.0669" y="686.8691">No message connects an AI Agent to an Adapter/Provider.</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="9.1738" x="1119.5" y="701.8921">2.</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="127.1177" x="1131.73" y="701.8921">Double Approval Guard:</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="359.5303" x="1261.9038" y="701.8921">Guard validates approval at entry (1.1.1) and revalidates at dispatch (2.1).</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="9.1738" x="1119.5" y="716.915">3.</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="134.4761" x="1131.73" y="716.915">Deterministic Operations:</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="388.2764" x="1269.2622" y="716.915">OperationsService executes only under non-expired, validated ApprovalRecord.</text></g><!--li