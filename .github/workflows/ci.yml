name: F.02 checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  offline-contract-models:
    name: Offline contracts and models
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Official release refs verified 2026-09-07; see tools/checks/README.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked Python environment and local package
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Install locked Mermaid parser
        run: npm ci --prefix tools/model-checks --ignore-scripts --no-audit --no-fund
      - name: Check isolated F.03 security candidate
        run: python -B -m pytest tests/security -q
      - name: Check initial records without a database
        run: python -B -m pytest tests/storage/test_records.py -q
      - name: Check bounded attachment parsers and customer codecs without a database
        run: python -B -m pytest tests/customer/test_evidence_validation.py tests/customer/test_codec_and_dto.py tests/customer/test_foundation_guards.py -q
      - name: Check mock label PDF renderer and validator without a database
        run: python -B -m pytest tests/unit/test_label_pdf.py tests/unit/test_label_pdf_validation.py -q
      - name: Check notification profile and independent fact integrity without a database
        run: python -B -m pytest --noconftest tests/lifecycle/test_notification_profile_offline.py tests/lifecycle/test_notification_fact_offline.py tests/lifecycle/test_notification_customer_origin_offline.py -q
      - name: Build and import installed packages outside checkout
        run: python -B tools/checks/check-installed.py
      - name: Check PR against its base WBS
        if: github.event_name == 'pull_request'
        env:
          WBS_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: python -B tools/checks/run.py offline --baseline-ref "$WBS_BASE_REF"
      - name: Check push artifacts and WBS structure
        if: github.event_name == 'push'
        # No independent agreed baseline is selected for an arbitrary branch push.
        run: python -B tools/checks/run.py offline --skip-baseline

  environment-plan:
    name: Plan PostgreSQL environment parts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.parts.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate complete lifecycle file coverage and emit matrix
        id: parts
        run: |
          matrix="$(python -B tools/checks/run.py ci-matrix)"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  environment-checks:
    name: PostgreSQL / ${{ matrix.part }}
    needs: environment-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.environment-plan.outputs.matrix) }}
    env:
      # Disposable CI service credentials; never use these outside this job.
      DATABASE_URL: postgresql+psycopg://returnops_ci:ci_synthetic_only@localhost:5432/returnops_f02_ci
    services:
      postgres:
        image: postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
        env:
          POSTGRES_USER: returnops_ci
          POSTGRES_PASSWORD: ci_synthetic_only
          POSTGRES_DB: returnops_f02_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U returnops_ci -d returnops_f02_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked Python environment and local package
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Check historical manual notification fixtures before the full suite
        if: matrix.part == 'foundation'
        # These 12 nodes also remain in their complete lifecycle file groups.
        run: |
          unset MANUAL_EVIDENCE_DIR
          python -B -m pytest \
            'tests/lifecycle/test_guards_postgresql.py::test_saved_notification_pending_failed_sent_keeps_identity_and_has_no_effects[0013_label_artifact_result-MANUAL_HANDLING-MANUAL_HANDLED]' \
            'tests/lifecycle/test_guards_postgresql.py::test_notification_cannot_change_frozen_identity_or_payload' \
            'tests/lifecycle/test_guards_postgresql.py::test_new_decision_rechecks_causal_founder_current_principal' \
            'tests/lifecycle/test_guards_postgresql.py::test_notification_retry_uses_current_service_not_expired_original_human_authority' \
            'tests/lifecycle/test_guards_postgresql.py::test_failed_notification_requires_saved_pending_retry_before_sent' \
            'tests/lifecycle/test_guards_postgresql.py::test_outcome_atomically_saves_stable_unclaimed_notification_intent_without_grant' \
            'tests/lifecycle/test_transaction_postgresql.py::test_supported_same_uow_notification_reclaim_invalidates_earlier_commit_proof' \
            -q --tb=short -x
      - name: Migrate and check the complete environment part
        env:
          # Each matrix job has a fresh service, checkout and temporary evidence directory.
          MANUAL_EVIDENCE_DIR: ${{ runner.temp }}/a201-pass-manual-${{ matrix.part }}-evidence
          ENVIRONMENT_PART: ${{ matrix.part }}
        run: python -B tools/checks/run.py environment --part "$ENVIRONMENT_PART"

  end-to-end-no-llm:
    # Independent evidence job for R.02 (docs/08): one synthetic cups case driven
    # end to end by the private tools/r02 driver against a fresh PostgreSQL 17
    # service. Mock effects only; no LLM. Not part of the ci-gate needs, which
    # tools/checks/run.py requires to stay exactly three.
    name: R.02 no-LLM end-to-end driver
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # Disposable CI service credentials; never use these outside this job.
      DATABASE_URL: postgresql+psycopg://returnops_ci:ci_synthetic_only@localhost:5432/returnops_f02_ci
    services:
      postgres:
        image: postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
        env:
          POSTGRES_USER: returnops_ci
          POSTGRES_PASSWORD: ci_synthetic_only
          POSTGRES_DB: returnops_f02_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U returnops_ci -d returnops_f02_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked Python environment and local package
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Migrate the fresh service database to head
        run: |
          python -B -m alembic upgrade head
          python -B -m alembic current
      - name: Run the private R.02 driver (one synthetic cups case, mock effects only)
        run: python -B tools/r02/driver.py --output "$RUNNER_TEMP/r02-run" --keep-api-log
      - name: Show the run receipt
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/r02-run/run-receipt.json" ]; then
            cat "$RUNNER_TEMP/r02-run/run-receipt.json"
          else
            echo "No run receipt was written."
          fi
      - name: Upload the run receipt, catalogue and API child log
        if: ${{ always() }}
        # Tag v4.6.2 resolved to this commit through the GitHub API on 2026-10-22.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r02-end-to-end-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r02-run
          if-no-files-found: warn
          retention-days: 14

  api-environment:
    name: API and PostgreSQL environment
    if: ${{ always() }}
    needs: [offline-contract-models, environment-plan, environment-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require every dependency and all seven environment parts to succeed
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python -B tools/checks/run.py ci-gate
      - name: Build runtime image and import installed packages outside app directory
        run: |
          docker build --tag returnops-a1-ci .
          docker run --rm -i --workdir /tmp --entrypoint python returnops-a1-ci -I -B - < tools/checks/probe-installed.py

  web-frontend:
    name: Web frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked frontend dependencies
        run: npm ci --prefix apps/web --ignore-scripts --no-audit --no-fund
      - name: Check TypeScript types
        run: npm run type-check --prefix apps/web
      - name: Run automated UI regression suite
        run: npm test --prefix apps/web
      - name: Build production bundle
        run: npm run build --prefix apps/web
