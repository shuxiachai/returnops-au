name: A2.06 PMP06 passive cost diagnostic

on:
  push:
    branches: [diag/86-a206-pmp06-cost-20261021]

permissions:
  contents: read

concurrency:
  group: a206-pmp06-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  pmp06-diagnostic:
    if: github.event_name == 'push' && github.ref == 'refs/heads/diag/86-a206-pmp06-cost-20261021' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Disposable CI service credentials; same isolated PG17 configuration.
      DATABASE_URL: postgresql+psycopg://returnops_ci:ci_synthetic_only@localhost:5432/returnops_f02_ci
      RETURNOPS_PMP06_COST_DIAGNOSTIC: "1"
    services:
      postgres:
        image: postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
        env:
          POSTGRES_USER: returnops_ci
          POSTGRES_PASSWORD: ci_synthetic_only
          POSTGRES_DB: returnops_f02_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U returnops_ci -d returnops_f02_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Print and require exact checkout identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          printf 'GITHUB_SHA=%s\n' "$GITHUB_SHA"
      - name: Install locked Python environment and local package
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Migrate ephemeral PostgreSQL
        run: |
          alembic upgrade head
          alembic current
      - name: Require exactly the one original node in collection preflight
        shell: bash
        run: |
          python -B -m pytest 'tests/lifecycle/test_founder_pass_manual_late_postgresql.py::test_PMP06_two_actual_backends_have_one_manual_intent[True]' --collect-only -q > "$RUNNER_TEMP/pmp06-collection.txt"
          cat "$RUNNER_TEMP/pmp06-collection.txt"
          python -B - <<'PY'
          import os
          from pathlib import Path
          expected = 'tests/lifecycle/test_founder_pass_manual_late_postgresql.py::test_PMP06_two_actual_backends_have_one_manual_intent[True]'
          lines = Path(os.environ['RUNNER_TEMP'], 'pmp06-collection.txt').read_text().splitlines()
          nodes = [line for line in lines if line.startswith('tests/') and '::' in line]
          assert nodes == [expected], 'Expected exactly one original PMP06 node'
          PY
      - name: Execute the original node once with passive diagnostics
        run: |
          unset MANUAL_EVIDENCE_DIR
          python -B -m pytest 'tests/lifecycle/test_founder_pass_manual_late_postgresql.py::test_PMP06_two_actual_backends_have_one_manual_intent[True]' -q --tb=short -x -p tools.checks.lifecycle_progress
