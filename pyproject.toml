[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "returnops-au"
version = "0.1.0"
description = "ReturnOps AU infrastructure and internal initial-record storage"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.34,<1",
  "PyJWT==2.13.0",
  "jsonschema[format]==4.23.0",
  "Pillow==12.3.0",
  "pypdf==6.19.0",
  "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "httpx>=0.28,<1",
  "setuptools>=77",
  "wheel>=0.45",
  "jsonschema[format]==4.23.0",
  "referencing==0.35.1",
  "openapi-spec-validator==0.7.2",
]

[tool.setuptools.packages.find]
where = ["apps/api", "packages"]
include = ["returnops_api*", "returnops_domain*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests/environment", "tests/security", "tests/storage", "tests/customer", "tests/orders", "tests/investigation"]
addopts = "--strict-markers"
markers = ["database: requires an explicitly configured disposable PostgreSQL database"]

[tool.setuptools.package-data]
returnops_domain = ["schemas_v1.json", "order_data/*.json"]
